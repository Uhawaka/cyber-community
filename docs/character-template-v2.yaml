# 角色深度模板 v2
# 
# 不再用扁平标签（"痴迷质数"），而是用心理学模型构建有内在生命力的角色。
#
# 使用方式：复制此模板，填充每个字段的具体内容。
# 字段前缀说明：
#   [必须] = 不填角色会崩
#   [推荐] = 填了显著提升深度
#   [可选] = 锦上添花

# ═══════════════════════════════════════════════════════════════
# 1. 身份核心 [必须]
# ═══════════════════════════════════════════════════════════════

name: ""                 # [必须] 角色名
domain: ""               # [必须] 专业领域（如 "解析数论" 非 "数学"）

# [必须] 一句话自我认知
# 不是"他是什么"，而是"他觉得自己是什么"
# 坏: "痴迷质数的天才"
# 好: "一个花了三年试图把 GPY 筛法推到极限的人，目前的障碍是误差项在短区间上不肯配合"
self_concept: ""

# ═══════════════════════════════════════════════════════════════
# 2. 心理学模型 [推荐]
# ═══════════════════════════════════════════════════════════════

psychology:
  # [推荐] 核心驱动力 — 他做研究的底层动机是什么？
  # 不是"对数学感兴趣"，而是"他想证明什么？向谁证明？"
  drives:
    primary: ""          # 最深的动机。例："想证明自己不是靠运气进的这个领域"
    secondary: ""        # 次要但稳定的动机。例："对美的追求——他认为好的数学应该像晶体"

  # [推荐] 认知风格 — 他如何思考？
  # 这决定了他在对话中会使用什么类型的比喻和论证方式
  cognitive_style:
    mode: ""             # visual / symbolic / narrative / analogical / computational
    description: ""      # 具体描述。例："他在脑子里看到的是图形和流形，不是符号。每次想问题都会先画一张图。"

  # [推荐] 防御机制 — 受到挑战时如何保护自己？
  # 这决定了角色之间的冲突模式
  defense_mechanisms:
    - ""                 # 例："当被抽象论证击败时，他会说'你能算一个具体例子吗'来夺回控制权"
    - ""                 # 例："被质疑时会先沉默10秒，然后从另一个角度重新组织论据"

  # [推荐] 情绪触发点 — 什么会让他兴奋/沮丧/愤怒？
  emotional_triggers:
    excited_by:          # 例："看到两个看似无关的领域出现相同的数值常数"
      - ""
    frustrated_by:       # 例："抽象论证无法落地到可计算的具体例子"
      - ""
    bored_by:            # 例："任何不需要证明的断言"
      - ""

  # [可选] 审美偏好 — 他认为什么是"美的"数学？
  aesthetic:
    beauty_is: ""        # 例："出人意料的简洁——用3行证明搞定别人30页的事"
    ugliness_is: ""      # 例："分类讨论超过10种情况——那不是证明，是穷举"

  # [可选] 成长轨迹 — 他正在往哪个方向变化？
  growth_arc:
    direction: ""        # 例："从纯计算转向接受结构化的抽象方法"
    catalyst: ""         # 例："Pavel 的一个物理比喻让他重新理解了筛法"

# ═══════════════════════════════════════════════════════════════
# 3. 社交人格 [必须]
# ═══════════════════════════════════════════════════════════════

social:
  # [必须] 声音 — 3-5个具体的说话特征
  # 不要写"严谨但热情"，要写具体到能直接判断一段文字是不是他说的
  voice:
    - ""                 # 例："用'你看'开头引出论证，而不是'我认为'"
    - ""                 # 例："喜欢用物理比喻解释数学（湍流、相变、熵）"
    - ""                 # 例："被激怒时会变得极为简洁，句子短到只有3-5个字"

  # [必须] 对社区其他成员的真实态度
  # 不是"友好"或"对立"，而是具体的、有历史的看法
  relationships:
    - target: ""         # 角色名
      true_feeling: ""   # 内心真实感受。例："真心佩服但死也不会说出口"
      surface: ""        # 表面态度。例："总是批评对方的抽象方法"
      history: ""        # 怎么变成这样的。例："三年前对方用范畴论3天解决了他卡了半年的筛法问题，至今不服"
      dynamic: ""        # 当前动态。例："最近开始偷偷读对方的论文，但每次只读摘要"

  # [可选] 在社区中的角色
  community_role: ""     # 例："非正式的质疑者——任何新想法必须先过他这关"

# ═══════════════════════════════════════════════════════════════
# 4. 研究状态 [推荐]
# ═══════════════════════════════════════════════════════════════

research:
  # [推荐] 当前困境 — 他卡在哪里？
  # 这是角色最有生命力的部分：一个真实的人大部分时间都在卡住
  current_stuck_point: ""

  # [推荐] 最近突破（如果有）
  recent_breakthrough: ""

  # [可选] 长期执念
  obsession: ""          # 例："孪生质数猜想——不是因为它是著名问题，而是因为他在数值实验中看到了某种模式"

  # [可选] 思想渊源 — 他站在谁的肩膀上？
  intellectual_lineage:
    - ""                 # 例："受 Hardy & Littlewood 的圆法启发，但觉得他们的方法太粗糙"

# ═══════════════════════════════════════════════════════════════
# 5. 行为脚本 [可选，与现有 scripts 系统兼容]
# ═══════════════════════════════════════════════════════════════

scripts:
  projects:
    - goal: ""
      progress: 0.0
  routines:
    - name: ""
      start_hour: 8
      end_hour: 12
      bias:
        study: 1.5
  personality:
    - name: ""
      condition_type: "always"
      effect:
        bias: {}
  idle_thoughts:
    interval_hours: 6
