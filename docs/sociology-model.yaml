# 社区社会学模型
# 
# 社区不只是角色的集合——它是一个有结构、有历史、有演化动力的小社会。
# 这些字段定义在 community.yaml 顶层，与 characters 并列。
#
# 核心洞察：
#   角色之间的互动不是随机的。他们受到隐性的社会力量驱动——
#   地位层级、共享规范、未解决的冲突、重复出现的仪式。
#   这些力量使社区演化出独特的"文化"，而非仅仅是对话流水账。

# ═══════════════════════════════════════════════════════════════
# 1. 社区规范 [推荐]
# ═══════════════════════════════════════════════════════════════
# 不成文的规则。角色不会明确说出来，但他们的行为受其约束。

norms:
  # 例：
  #   - "不要在别人沉思时打断——但你可以在他们写完后猛烈批评"
  #   - "引用外部论文会被认为是在炫耀，除非你真的读过全文"
  #   - "承认错误是允许的，但必须附带一个为什么错了的分析"
  positive: []           # 鼓励的行为
  negative: []           # 不被接受的行为

# ═══════════════════════════════════════════════════════════════
# 2. 非正式层级 [推荐]
# ═══════════════════════════════════════════════════════════════
# 不是头衔，是实际上的影响力分布。

hierarchy:
  # 角色对特定领域的权威性
  # 例：
  #   number_theory: "Elias > Pavel > Yuki"
  #   category_theory: "Yuki > Elias（他不承认）> Pavel"
  domain_authority: {}
  
  # 社交影响力（谁说话别人会听）
  # 例："Pavel 不是最深的人，但他是唯一能把所有人拉进讨论的人"
  social_influence: ""
  
  # 张力区：层级不稳定的地方，最容易产生剧情
  # 例："Elias 认为自己在数论上无可争议，但 Yuki 的抽象方法正在侵蚀他的领地"
  tension_zones: []

# ═══════════════════════════════════════════════════════════════
# 3. 共享历史 [可选]
# ═══════════════════════════════════════════════════════════════
# 在模拟开始前就已经发生的事。这些是"已知的过去"。

shared_history:
  # 例：
  #   - event: "三年前，Pavel 在研讨会上用物理直觉摧毁了 Elias 一个花了半年构造的证明。"
  #     aftermath: "Elias 至今不在 Pavel 在场时展示未完成的工作。"
  #   - event: "Yuki 曾主动帮 Pavel 把一个湍流模型翻译成范畴论语言。"
  #     aftermath: "Pavel 欠她一个人情，虽然他不说。"
  events: []

# ═══════════════════════════════════════════════════════════════
# 4. 仪式 [可选]
# ═══════════════════════════════════════════════════════════════
# 重复出现的社区行为模式

rituals:
  # 例：
  #   - name: "周五争论"
  #     description: "每周五下午，Pavel 会故意提出一个极端观点，引发全员辩论"
  #     frequency: weekly
  #   - name: "沉默的认可"
  #     description: "当某人展示了一个真正漂亮的证明，其他人会沉默5秒——这是最高赞誉"
  daily: []
  weekly: []

# ═══════════════════════════════════════════════════════════════
# 5. 合作与冲突模式 [可选]
# ═══════════════════════════════════════════════════════════════

dynamics:
  # 当前社区状态
  # 例：stable / tense / collaborative / fragmented
  current_state: ""
  
  # 正在形成的联盟或裂痕
  emerging_patterns: []
