# Soul v2 — normative runtime schema (matches engine/soul.py empty_soul())
#
# Identity ≠ current project.
#   soul / identity  → who they are (stable)
#   orientation      → what occupies them now (mutable)
#
# NEVER write into Soul: tool stdout, paper paths, transient calculations, chitchat.

soul_version: "2.0"
name: ""

identity:
  craft: ""              # trained practice / vocation (stable)
  who_i_am: ""           # self-narrative
  core_belief: ""        # about truth/method — NOT the open problem
  how_i_think: ""
  how_i_protect: ""
  what_drives_me: ""
  voice: []              # 2-4 speech habits
  seed_domains: []       # YAML seeds — starting territories
  domains: []            # living territories (seeds + opened at runtime)

bonds: {}
  # OtherName:
  #   stance: "..."
  #   history: []          # ≤5 short notes

orientation:
  current_focus: ""      # mutable research / life program
  open_question: ""
  tensions: []           # ≤3
  recently_opened: []    # short log of newly opened domains

reflections: []
  # - day: 3
  #   about: self          # self | other:Name | work | community
  #   statement: "..."
  #   confidence: 0.6

milestones: []
  # - day: 5
  #   moment: "..."        # rare identity-changing moments only

meta:
  seeded_from: ""
  created_at: ""
  last_calibrated_day: 0

recent_murmurs: []         # ephemeral prompt flavor — not identity
