# 赛博社区 · 世界定义语言 v2
# World Definition Language (WDL)
#
# 设计原则:
#   1. 渐进式复杂度 — 3行能跑，300行能深
#   2. 声明式 — 用户描述"是什么"，引擎推导"怎么做"
#   3. 模板继承 — 世界模板 → 角色原型 → 具体角色
#   4. 自动展开 — 缺失字段由引擎根据领域/原型推导
#
# 复杂度层级:
#   Tier 1 (minimal)   = 只需 name + domain + seed
#   Tier 2 (standard)  = + voice + research + relationships
#   Tier 3 (full)      = + psychology model (OCEAN/cognitive/defense)

# ═══════════════════════════════════════════════════════════════
# 顶层结构
# ═══════════════════════════════════════════════════════════════

format_version: "2.0"

meta:
  name: ""                # [必须] 世界名称
  description: ""         # [推荐] 一句话描述
  template: ""            # [可选] 继承哪个世界模板
  author: ""              # [可选]

# [必须] 世界观基础设定
world:
  domain: ""              # 领域: mathematics | literature | philosophy | science | art | custom
  permeability: "connected"  # enclosed | connected | hybrid
  worldview: ""           # [推荐] 这个世界的基本设定。例: "外星观察站" "古代文人雅集" "AI哲学沙龙"

# [可选] 社会学（不写则引擎根据角色关系自动推导）
sociology:
  development_stage: "forming"  # forming | storming | norming | performing
  norms: {}
  hierarchy: {}
  rituals: {}
  collective_memory: {}

# [必须] 至少1个角色
characters:
  - $template: ""        # [可选] 继承角色原型（见 prototypes/）
    name: ""             # [必须]
    domain: ""           # [必须] 具体子领域
    seed: ""             # [必须] 核心种子 — 一句话定义这个角色

    # ── Tier 2 ──
    voice: []            # 具体的说话特征
    research: {}         # 当前研究项目+卡点
    relationships: []    # 对其他角色的态度

    # ── Tier 3 ──
    personality: {}      # OCEAN
    drives: {}           # 自决理论
    cognitive: {}        # 思维方式
    defense: {}          # 防御机制
    self_concept: ""     # 自我叙事

    # ── 行为脚本 ──
    scripts: {}

# [可选] 世界级工具（角色可用的工具由世界决定）
tools: []
