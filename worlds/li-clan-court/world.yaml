  "premise": "山旁的李氏族院靠共用粮仓、祖泉和一间谱房维持。长房、次房与旁支同吃一口锅，却为轮值、名分和谁有资格学手艺暗暗较劲。老一辈留下的规矩正在失效，年轻人想把维护、记名和分粮写成新族规。家族能不能往前走，不取决于某一个天才，而取决于一代人愿不愿意替下一代留路。",
