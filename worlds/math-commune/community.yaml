tools:
  - name: run_code
    description: >
      Write and run Python experiments toward Claims on cited seed-shelf problems
    timeout_seconds: 30
    sandbox: true
  - name: write_paper
    description: >
      Write attack notes with Source / Frontier-found / Claim (LaTeX) /
      Tools-opened / Sketch / Obstruction — must contain real formulas
  - name: search_arxiv
    description: >
      Search arXiv; returns full abstracts + ids. Then use read_arxiv on one hit.
    max_results: 5
  - name: read_arxiv
    description: >
      Deep-read one arXiv paper: full abstract + ar5iv/HTML body or TeX math
      excerpts. This is how you see actual mathematics — not title nouns.
    max_chars: 7000
  - name: search_web
    description: >
      Open Clay, top journals (Annals/Inventiones/Acta/JAMS/IHÉS), surveys —
      and find further frontier sites beyond the seed shelf; bring citations back
    backend: bing
    max_results: 5
