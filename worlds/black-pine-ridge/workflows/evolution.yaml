{
  "schema_version": "world-workflow/v1alpha1",
  "kind": "evolution",
  "steps": [
    {"op": "environment_update"},
    {"op": "incident_scheduler"},
    {"op": "scene_turns"},
    {"op": "scheme_progress"},
    {"op": "memory_consolidation"},
    {"op": "phase_check"}
  ],
  "policy": {
    "need_decay": {"fatigue": 2, "social": 2, "resources": 1, "knowledge": 1, "exploration": 1},
    "action_budget": 9,
    "opportunity_budget": 24,
    "incident_budget": 1,
    "memory_budget": 1,
    "max_catchup_ticks": 24,
    "hot_character_ids": [],
    "hot_location_ids": [],
    "phase_predicates": [
      {
        "id": "rain-watch",
        "target": {"kind": "elapsed_tick", "minimum": 8},
        "predicates": [{"type": "tick", "minimum": 8}],
        "unresolved_items": ["名册仍未闭合", "角色尚未离开当前这一层"]
      }
    ]
  }
}
